<!doctype html>
<html><head><meta charset="utf-8"><title>Gesture Control</title>
<style>
  body { width: 300px; margin: 0; font: 14px system-ui, sans-serif; color: #1f2329; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #e3e7ee; }
  header img { width: 22px; height: 22px; } header b { flex: 1; font-size: 15px; }
  section { padding: 10px 14px; border-bottom: 1px solid #e3e7ee; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
  .muted { color: #6a7280; font-size: 12px; line-height: 1.45; }
  .pill { font: 12px ui-monospace, Menlo, monospace; background: #edf0f5; border-radius: 99px; padding: 2px 8px; }
  button { font: 600 13px system-ui; border-radius: 8px; border: 1px solid #d5dbe5; background: #f6f8fb; padding: 7px 10px; cursor: pointer; }
  button.primary { background: #3557c4; border-color: #3557c4; color: #fff; }
  select { font: 13px system-ui; padding: 5px; border-radius: 7px; border: 1px solid #d5dbe5; max-width: 170px; }
  .switch { position: relative; width: 40px; height: 22px; } .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #c9cfda; border-radius: 99px; cursor: pointer; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #2f8a5b; } input:checked + .slider:before { transform: translateX(18px); }
  .err { color: #b33; }
</style></head>
<body>
<header><img src="icons/icon48.png" alt=""><b>Gesture Control</b>
  <label class="switch" title="Camera and mic on/off"><input type="checkbox" id="enabled"><span class="slider"></span></label></header>
<section>
  <div class="row"><span>Gestures</span><button id="watchBtn">Pause</button></div>
  <div class="row"><span>Preset</span><select id="preset"></select></div>
  <p class="muted" id="help"></p>
</section>
<section>
  <div class="row"><span class="pill" id="cam">camera: off</span><span class="pill" id="mic">mic: off</span></div>
  <div class="row"><span class="pill" id="face">face: –</span><span class="pill" id="hand">hand: –</span></div>
  <p class="muted">Last: <span id="last">–</span></p>
  <p class="muted err" id="err" hidden></p>
</section>
<section class="row"><button class="primary" id="opts">Settings &amp; calibration</button><span class="muted">Alt+Shift+G pauses</span></section>
<script type="module" src="popup.js"></script>
</body></html>
