<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clickable demo of Recast, a self-hosted content repurposing app.">
<title>Recast Demo</title>
<style>:root {
  --bg: #f6f6fb; --panel: #ffffff; --panel-2: #f1f0f8; --border: #e3e1ef; --text: #1b1a2e; --muted: #6b6984; --faint: #9a98b0;
  --accent: #6d4aff; --accent-2: #8b6dff; --accent-soft: #ece7ff; --accent-text: #ffffff;
  --ok: #16a34a; --ok-soft: #dcfce7; --warn: #b45309; --warn-soft: #fef3c7; --err: #dc2626; --err-soft: #fee2e2; --info: #2563eb; --info-soft: #dbeafe;
  --sidebar: #15142a; --sidebar-text: #c9c6e4; --sidebar-active: #2a2650;
  --radius: 12px; --radius-sm: 8px; --shadow: 0 1px 2px rgba(20,18,50,.05), 0 4px 16px rgba(20,18,50,.06);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f0e1c; --panel: #17162a; --panel-2: #1f1d36; --border: #2c2a48; --text: #ecebf7; --muted: #a09dbd; --faint: #6f6c8c;
    --accent: #8b6dff; --accent-2: #a58dff; --accent-soft: #2a2350; --ok-soft: #12321f; --warn-soft: #3a2a0c; --err-soft: #3b1515; --info-soft: #132546;
    --sidebar: #0b0a16; --sidebar-active: #221e44; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  } }
:root[data-theme="dark"] {
    --bg: #0f0e1c; --panel: #17162a; --panel-2: #1f1d36; --border: #2c2a48; --text: #ecebf7; --muted: #a09dbd; --faint: #6f6c8c;
    --accent: #8b6dff; --accent-2: #a58dff; --accent-soft: #2a2350; --ok-soft: #12321f; --warn-soft: #3a2a0c; --err-soft: #3b1515; --info-soft: #132546;
    --sidebar: #0b0a16; --sidebar-active: #221e44; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h1 { font-size: 22px; font-weight: 700; } h2 { font-size: 17px; font-weight: 650; } h3 { font-size: 15px; font-weight: 600; }
p { margin: 0 0 8px; }
.boot { display: grid; place-items: center; height: 100vh; color: var(--muted); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; } .tiny { font-size: 11.5px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 10px; } .row.wrap { flex-wrap: wrap; } .row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1; min-width: 0; } .right { margin-left: auto; } .center { text-align: center; }
.gap-lg { gap: 18px; } .mt { margin-top: 14px; } .mt-lg { margin-top: 24px; } .mb { margin-bottom: 14px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }

/* Layout */
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.sidebar { background: var(--sidebar); color: var(--sidebar-text); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; color: #fff; font-weight: 750; font-size: 18px; letter-spacing: -.2px; }
.brand img { width: 28px; height: 28px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; color: var(--sidebar-text); font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.05); text-decoration: none; color: #fff; }
.nav a.active { background: var(--sidebar-active); color: #fff; }
.nav svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav .count { margin-left: auto; background: var(--accent); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 7px; font-weight: 600; }
.sidebar .me { margin-top: auto; padding: 12px; border-top: 1px solid rgba(255,255,255,.08); font-size: 13px; }
.sidebar .me .name { color: #fff; font-weight: 600; }
.sidebar .me button { background: none; border: 0; color: var(--sidebar-text); padding: 0; cursor: pointer; font: inherit; text-decoration: underline; }
.main { min-width: 0; padding: 26px 32px 60px; max-width: 1280px; width: 100%; }
.page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); margin-top: 3px; }
.mobile-bar { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 250px; z-index: 50; transform: translateX(-100%); transition: transform .2s; }
  .shell.nav-open .sidebar { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.4); }
  .mobile-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--sidebar); color: #fff; font-weight: 700; position: sticky; top: 0; z-index: 40; }
  .mobile-bar button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
  .main { padding: 18px 16px 60px; }
}

/* Surfaces */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card.pad { padding: 18px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.card-body { padding: 16px 18px; }
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grid.auto-sm { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
@media (max-width: 1100px) { .grid.cols-4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .grid.cols-3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 700px) { .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: minmax(0, 1fr); } }
.divider { height: 1px; background: var(--border); margin: 14px 0; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty h3 { color: var(--text); margin-bottom: 6px; }

/* Controls */
button, .btn { font: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-weight: 550; cursor: pointer; white-space: nowrap; line-height: 1.3; }
.btn:hover { border-color: var(--accent-2); text-decoration: none; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover { background: var(--accent-2); }
.btn.danger { color: var(--err); } .btn.danger:hover { border-color: var(--err); }
.btn.ghost { background: transparent; border-color: transparent; } .btn.ghost:hover { background: var(--panel-2); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 7px; }
.btn.block { width: 100%; }
.btn svg { width: 16px; height: 16px; }
label.field { display: flex; flex-direction: column; gap: 5px; font-weight: 550; font-size: 13px; }
label.field .help, .help { font-weight: 400; color: var(--muted); font-size: 12px; }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=number], input[type=datetime-local], input[type=time], select, textarea {
  font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 80px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 16px; height: 16px; }
input[type=range] { accent-color: var(--accent); width: 100%; }
input[type=color] { width: 42px; height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--panel); }
label.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--panel); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--muted); font-weight: 550; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.toggle { position: relative; width: 38px; height: 22px; flex: none; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: var(--border); border-radius: 99px; cursor: pointer; transition: .15s; }
.toggle span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked + span { background: var(--accent); }
.toggle input:checked + span::after { transform: translateX(16px); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 550; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.chip.click { cursor: pointer; border: 1px dashed var(--border); } .chip.click:hover { color: var(--accent); border-color: var(--accent); }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.err { background: var(--err-soft); color: var(--err); } .chip.info { background: var(--info-soft); color: var(--info); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 14px; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 650; margin: 18px 0 8px; }

/* Platform badges */
.pf { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: #fff; font-weight: 800; font-size: 13px; flex: none; }
.pf.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 10.5px; }
.pf.lg { width: 42px; height: 42px; border-radius: 11px; font-size: 17px; }
.pf svg { width: 60%; height: 60%; }
.avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex: none; }
.stack { display: inline-flex; } .stack > * { margin-left: -6px; box-shadow: 0 0 0 2px var(--panel); } .stack > *:first-child { margin-left: 0; }

/* Stats */
.stat { padding: 16px 18px; }
.stat .label { color: var(--muted); font-size: 12.5px; font-weight: 550; }
.stat .value { font-size: 28px; font-weight: 750; letter-spacing: -.5px; margin-top: 2px; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 120px; padding-top: 10px; }
.bars .bar { flex: 1; background: var(--accent-soft); border-radius: 5px 5px 2px 2px; position: relative; min-height: 3px; }
.bars .bar.has { background: var(--accent); }
.bars .bar:hover::after { content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel); font-size: 11px; padding: 2px 6px; border-radius: 5px; white-space: nowrap; margin-bottom: 4px; }
.bar-labels { display: flex; gap: 5px; font-size: 10.5px; color: var(--faint); } .bar-labels span { flex: 1; text-align: center; }

/* Lists */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--border); }
.list-item:last-child { border-bottom: 0; }
.list-item.click { cursor: pointer; } .list-item.click:hover { background: var(--panel-2); }
.thumb { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; background: var(--panel-2); flex: none; display: grid; place-items: center; color: var(--faint); overflow: hidden; }
.thumb.wide { width: 80px; height: 45px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.day-head { padding: 8px 18px; background: var(--panel-2); font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
.progress { height: 5px; background: var(--panel-2); border-radius: 9px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .3s; }
.progress.indet > div { width: 35% !important; animation: indet 1.2s infinite ease-in-out; }
@keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 9px 14px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs .n { background: var(--panel-2); border-radius: 99px; padding: 0 7px; margin-left: 5px; font-size: 11.5px; }

/* Media grid */
.media-card { overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform .1s; }
.media-card:hover { transform: translateY(-2px); }
.media-card .poster { aspect-ratio: 16/10; background: var(--panel-2); position: relative; display: grid; place-items: center; color: var(--faint); }
.media-card .poster img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.media-card .poster .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.7); color: #fff; font-size: 11.5px; padding: 1px 6px; border-radius: 5px; font-weight: 600; }
.media-card .poster .st { position: absolute; left: 8px; top: 8px; }
.media-card .meta { padding: 10px 12px 12px; }
.media-card .title { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
.dropzone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--muted); transition: .15s; }
.dropzone.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* Modal */
.modal-back { position: fixed; inset: 0; background: rgba(10,8,30,.55); display: grid; place-items: center; padding: 20px; z-index: 100; animation: fade .12s; }
.modal { background: var(--panel); border-radius: 16px; width: min(640px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal.wide { width: min(980px, 100%); }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.modal-head .x { margin-left: auto; background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
.modal-body { padding: 18px 20px; overflow: auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
video.player { width: 100%; max-height: 60vh; background: #000; border-radius: 10px; display: block; }

/* Toasts */
#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 200; max-width: min(420px, calc(100vw - 36px)); }
.toast { background: var(--text); color: var(--panel); padding: 11px 14px; border-radius: 10px; box-shadow: var(--shadow); animation: fade .15s; font-weight: 500; }
.toast.err { background: var(--err); color: #fff; } .toast.ok { background: var(--ok); color: #fff; }

/* Auth */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.auth .pitch { background: radial-gradient(1200px 600px at 0% 0%, #3b2a9e 0%, #15142a 60%); color: #e9e6ff; padding: 56px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.auth .pitch h1 { font-size: 38px; color: #fff; letter-spacing: -1px; max-width: 520px; }
.auth .pitch ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; max-width: 480px; }
.auth .pitch li { display: flex; gap: 12px; align-items: flex-start; color: #cfc9f5; }
.auth .pitch li b { color: #fff; }
.auth .pitch .flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.auth .form { display: grid; place-items: center; padding: 32px 20px; }
.auth .form .card { width: min(400px, 100%); padding: 28px; }
@media (max-width: 860px) { .auth { grid-template-columns: 1fr; } .auth .pitch { padding: 32px 20px; } .auth .pitch h1 { font-size: 28px; } }

/* Workflow editor */
.flow-arrow { color: var(--faint); font-size: 18px; }
.src-option { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--panel); text-align: left; font: inherit; color: inherit; }
.src-option:hover { border-color: var(--accent-2); }
.src-option.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.dest { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); margin-bottom: 14px; }
.dest > .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel-2); border-radius: var(--radius) var(--radius) 0 0; }
.dest > .body { padding: 14px 16px; }
.subtabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.subtabs button { border: 1px solid var(--border); background: var(--panel); border-radius: 99px; padding: 5px 12px; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.subtabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.preview-box { background: var(--panel-2); border-radius: 10px; padding: 12px; white-space: pre-wrap; font-size: 13px; border: 1px solid var(--border); max-height: 220px; overflow: auto; }
.counter { font-size: 11.5px; color: var(--faint); text-align: right; } .counter.over { color: var(--err); font-weight: 600; }
.sticky-foot { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 18px 0 6px; display: flex; gap: 10px; justify-content: flex-end; }

/* Brand preview */
.phone { width: 220px; aspect-ratio: 9/16; border-radius: 22px; overflow: hidden; position: relative; background: linear-gradient(160deg, #ff8a5c, #7c5cff 55%, #2b1f6e); box-shadow: 0 10px 30px rgba(0,0,0,.25); border: 6px solid #111; flex: none; }
.phone .logo { position: absolute; }
.phone .wm { position: absolute; color: rgba(255,255,255,.85); font-weight: 700; font-size: 10px; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.phone .cap { position: absolute; left: 8%; right: 8%; text-align: center; font-weight: 800; line-height: 1.2; }
.phone .hl { position: absolute; top: 12%; left: 10%; right: 10%; text-align: center; color: #fff; font-weight: 800; font-size: 13px; padding: 6px; }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); border-left: 1px solid var(--border); border-top: 1px solid var(--border); }
.cal .dow { padding: 6px 8px; font-size: 11.5px; font-weight: 650; color: var(--faint); text-transform: uppercase; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--panel-2); }
.cal .day { min-height: 96px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; display: flex; flex-direction: column; gap: 3px; background: var(--panel); }
.cal .day.other { background: var(--panel-2); opacity: .6; }
.cal .day.today .num { background: var(--accent); color: #fff; border-radius: 99px; padding: 0 6px; }
.cal .num { font-size: 12px; font-weight: 650; color: var(--muted); align-self: flex-start; }
.cal .ev { display: flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 4px; border-radius: 5px; background: var(--panel-2); cursor: pointer; overflow: hidden; white-space: nowrap; }
.cal .ev:hover { background: var(--accent-soft); }
@media (max-width: 700px) { .cal .day { min-height: 60px; } .cal .ev span.t { display: none; } }
.checklist .item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.checklist .item:last-child { border-bottom: 0; }
.checklist .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; flex: none; font-size: 13px; font-weight: 700; color: var(--muted); }
.checklist .done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.checklist .done .t { text-decoration: line-through; color: var(--muted); }
table.simple { width: 100%; border-collapse: collapse; }
table.simple th, table.simple td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.simple th { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 650; }
.lvl { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 6px; background: var(--faint); }
.lvl.success { background: var(--ok); } .lvl.error { background: var(--err); } .lvl.info { background: var(--info); } .lvl.warn { background: var(--warn); }
.callout { padding: 12px 14px; border-radius: 10px; background: var(--info-soft); color: var(--text); border: 1px solid transparent; }
.callout.warn { background: var(--warn-soft); } .callout.err { background: var(--err-soft); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 700px) {
  .page-head .right { margin-left: 0; flex-wrap: wrap; }
  .modal-body .grid.cols-2 { grid-template-columns: minmax(0, 1fr); }
}
.ellipsis, .grow { min-width: 0; }
.list-item > * { min-width: 0; }
.thumb .ic svg, .media-card .poster .ic svg { width: 26px; height: 26px; }
@media (max-width: 700px) {
  .list-item { flex-wrap: wrap; padding: 11px 16px; }
  .list-item > .grow { flex-basis: calc(100% - 70px); }
}
.shell > div { min-width: 0; }

/* ---- demo build additions ---- */
.demo-banner { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--accent-soft); color: var(--text); font-size: 13px; border-bottom: 1px solid var(--border); text-align: center; }
.demo-banner button { font: inherit; font-weight: 600; font-size: 12.5px; padding: 3px 10px; border-radius: 7px; border: 1px solid var(--accent); background: var(--panel); color: var(--accent); cursor: pointer; }
.demo-banner button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a[href*="download=1"] { display: none !important; }
.sidebar { height: auto; min-height: 100vh; }
@media (min-width: 861px) { .sidebar { position: sticky; top: 0; height: 100vh; } }
